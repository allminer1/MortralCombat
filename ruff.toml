line-length = 110
target-version = "py312"
# tools/gate is the archived Phase 0 record; legacy/ is frozen.
extend-exclude = ["legacy", "tools/gate", "frontend", "*.md"]

[lint]
select = ["E", "F", "W", "I", "B", "UP"]

[lint.isort]
known-first-party = ["app", "legacy_artifacts", "make_golden"]

[lint.flake8-bugbear]
# FastAPI's dependency markers are meant to be used as argument defaults.
extend-immutable-calls = ["fastapi.Depends"]
