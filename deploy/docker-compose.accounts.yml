# Accounts and saved history: adds PostgreSQL and switches the feature on in the API.
# Used when ENABLE_ACCOUNTS=true in deploy/.env (deploy.sh adds this file).
#
# DO NOT ENABLE IN PRODUCTION before the institutional sign-off is recorded in
# docs/DECISIONS.md (docs/REBUILD_SPEC.md Section 8).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: neomortalsurv
      POSTGRES_DB: neomortalsurv
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neomortalsurv -d neomortalsurv -q"]
      interval: 10s
      timeout: 5s
      retries: 6
    cap_drop:
      - ALL
    cap_add: # what the official image needs to drop from root to the postgres user
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    # Not published: reachable only from the api container.
    expose:
      - "5432"

  api:
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENABLE_ACCOUNTS: "true"
      DATABASE_URL: postgresql://neomortalsurv:${POSTGRES_PASSWORD}@db:5432/neomortalsurv
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-30}
      SESSION_MAX_HOURS: ${SESSION_MAX_HOURS:-12}

volumes:
  pg_data:
