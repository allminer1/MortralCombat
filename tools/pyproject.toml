[project]
name = "neomortalsurv-tools"
version = "0"
description = "One-off scripts: model export, golden data, sweep report. Never installed in the backend image."
requires-python = "==3.12.*"
# torch, numpy, pandas, scikit-learn and joblib are the versions in legacy/requirements.txt
# (the environment the production Streamlit app runs with).
dependencies = [
    "torch==2.7.1",
    "numpy==2.2.6",
    "pandas==2.3.1",
    "scikit-learn==1.7.0",
    "joblib==1.5.1",
    "onnx",
    "onnxruntime",
]

[tool.uv]
package = false
